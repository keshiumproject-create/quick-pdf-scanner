workflows:
  android-workflow:
    name: Android APK ve AAB Derleme
    max_build_duration: 30
    scripts:
      - name: Flutter paketlerini indir
        script: flutter pub get
      - name: Android proje dosyalarini olustur
        script: flutter create . --platforms=android
      - name: ML Kit ve R8 ayarlarini yapilandir
        script: |
          python3 - << 'PY'
          import glob, os, re

          # 1. MainActivity.kt dosyasini FlutterFragmentActivity yap
          for path in glob.glob("android/app/src/main/**/MainActivity.kt", recursive=True):
              with open(path, "r") as f:
                  content = f.read()
              pkg = next((line for line in content.splitlines() if line.startswith("package ")), "package com.example.quick_pdf_scanner")
              with open(path, "w") as f:
                  f.write(f"{pkg}\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity : FlutterFragmentActivity()\n")

          # 2. AndroidManifest.xml icine ML Kit docscan metadata ekle
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              meta = '<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="docscan" />'
              if "com.google.mlkit.vision.DEPENDENCIES" not in m:
                  m = m.replace("</application>", f"        {meta}\n    </application>")
                  with open(manifest_path, "w") as f:
                      f.write(m)

          # 3. build.gradle.kts / build.gradle icinde R8 sıkıştırmayı kesin kapat
          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r") as f:
                  g = f.read()
              g = g.replace("signingConfig = signingConfigs.getByName(\"debug\")", "signingConfig = signingConfigs.getByName(\"debug\")\n            isMinifyEnabled = false\n            isShrinkResources = false")
              with open("android/app/build.gradle.kts", "w") as f:
                  f.write(g)
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r") as f:
                  g = f.read()
              g = g.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false")
              with open("android/app/build.gradle", "w") as f:
                  f.write(g)
          PY
      - name: Test APK Derle
        script: flutter build apk --release --no-shrink
      - name: Play Store AAB Derle
        script: flutter build appbundle --release --no-shrink
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
